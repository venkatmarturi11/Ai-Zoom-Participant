databases:
  - name: zoom-assistant-db
    databaseName: zoom_assistant
    plan: free
    postgresMajorVersion: "16"

services:
  # 0. Redis / BullMQ backing store
  - type: keyvalue
    name: zoom-assistant-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # 1. Fastify API + OAuth + Telegram Bot (ALL-IN-ONE)
  #    The Telegram bot long-polling runner is embedded inside the API server
  #    to avoid 409 Conflict errors from multiple services polling the same token.
  #    IMPORTANT (free plan only): Render spins this service down after 15 min
  #    of no inbound HTTP traffic. Since nothing pings this service on its own,
  #    the bot's long-polling loop stops and never restarts on its own.
  #    Set up a free external uptime monitor (UptimeRobot / cron-job.org) to hit
  #    GET /health every ~10 minutes, or move this service to plan: starter.
  - type: web
    name: Ai-Zoom-Participant
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run db:generate && (npm run db:push || true) && npm run build
    startCommand: node apps/api/dist/index.js
    envVars: &sharedEnv
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: zoom-assistant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zoom-assistant-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: AUTHORIZED_TELEGRAM_IDS
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_REDIRECT_URI
        sync: false
      - key: ZOOM_SDK_KEY
        sync: false
      - key: ZOOM_SDK_SECRET
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_DISPLAY_NAME
        value: Meeting Assistant
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata

  # NOTE: The separate Telegram Bot worker has been REMOVED.
  # Bot polling is now embedded in the API service above to prevent
  # 409 Conflict errors from two services polling the same bot token.

  # 3. Zoom Meeting Worker Daemon
  #    Runs Puppeteer + headless Chromium to physically join Zoom meetings.
  #    MUST use Docker runtime — Render's native Node runtime does NOT run this
  #    repo's Dockerfile, so Chromium (installed via `apk add chromium` in the
  #    Dockerfile) would never exist in the container under runtime: node.
  - type: worker
    name: Ai-Zoom-Participant-Worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/worker/dist/index.js
    region: singapore
    plan: starter
    envVars: *sharedEnv

  # 4. BullMQ Scheduler & Server Recovery Daemon
  - type: worker
    name: Ai-Zoom-Participant-Scheduler
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run db:generate && (npm run db:push || true) && npm run build
    startCommand: node apps/scheduler/dist/index.js
    envVars: *sharedEnv
